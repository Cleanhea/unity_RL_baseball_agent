behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/smoke_stage2_auto/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 0.0002
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100
    max_steps: 300
    time_horizon: 64
    summary_freq: 10
  BaseballPitcher:
