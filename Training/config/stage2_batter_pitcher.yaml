# Stage 2: batter (team 0) and pitcher (team 1) trained at the same time.
# Scene: Assets/BaseballSimulation/Scenes/Training/Stage2_BatterPitcher.unity
# The batter starts from the stage 1 checkpoint (observations, actions and network size must match stage 1).
# The pitcher decides once per pitch while the batter decides ~23 times (measured), so the pitcher buffer is smaller.
#
# If simultaneous training is unstable (Pitch Type/* or Matchup/* swinging back and forth while Benchmark */*
# does not improve), use stage2_batter_pitcher_selfplay.yaml instead: the teams take turns learning against
# frozen past snapshots (python Training/auto_curriculum.py --self-play).
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/stage1_batter/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 20000
  BaseballPitcher:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 400000
    time_horizon: 8
    summary_freq: 2000
