# Camera6: 256x256 grayscale x6, 10ms decisions. Expanded stage-1 weights; fresh run only.
# Dedicated entry point: python Training/prepare_batter.py (not ordinary mlagents-learn).
# Stage1_Batter scene; only batter learns against a staged script pitcher.
# The preparation manager advances from actual fair-contact / qualified-hit / discipline stats.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/initialization/batter_camera6_100hz/checkpoint.pt
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 1.0e-4
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.9746794345
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9949874371
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 20000
environment_parameters:
  batter_preparation: 0.0
  batter_prepared: 1.0
