# Camera batter contract (2026-10-07): 256x256 grayscale x3; incompatible with ray checkpoints.
# Resume an existing stage2_batter_pitcher run with --resume.
# Keep this in sync with stage2_batter_pitcher.yaml except for BaseballBatter.init_path:
# ML-Agents 1.1.0 prioritizes init_path over the run's own checkpoint even with --resume.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 20000
  BaseballPitcher:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 400000
    time_horizon: 8
    summary_freq: 2000
