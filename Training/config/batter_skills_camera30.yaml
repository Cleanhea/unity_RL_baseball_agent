# Camera30 timing -> height -> angles -> bat position. Body stays fixed.
# Requires prepare_batter.py --skills; final skill -> full preparation -> stage 2.
# Supply the preserved trained checkpoint with --initial-checkpoint for a fresh run.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/initialization/batter_camera30_100hz/checkpoint.pt
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 1.0e-4
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.9746794345
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9949874371
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 4000000
    time_horizon: 64
    summary_freq: 20000
environment_parameters:
  batter_preparation: 0.0
  batter_prepared: 1.0
  batter_skill: 0.0
