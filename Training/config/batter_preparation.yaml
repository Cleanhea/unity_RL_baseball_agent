# Dedicated entry point: python Training/prepare_batter.py (not ordinary mlagents-learn).
# Stage1_Batter scene; only batter learns against a staged script pitcher.
# The preparation manager advances from actual fair-contact / qualified-hit / discipline stats.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/stage1_batter_camera_power/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 1.0e-4
      beta: 5.0e-3
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 50000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  batter_preparation: 0.0
  batter_prepared: 1.0
