# Camera batter contract (2026-10-07): 256x256 grayscale x3; incompatible with ray checkpoints.
# Stage 1: batter only. Scene: Assets/BaseballSimulation/Scenes/Training/Stage1_Batter.unity
# Contact -> solid centered hits -> limited pose/location -> full batting (2026-10-08).
# The +1.5 contact bonus is lesson 0 only and is revoked for foul/invalid contact.
# Lessons 1-3: weak fair hits earn <=0.5; Q>=0.6, >=120 km/h, 5-35 deg earn >=2.63.
# Start a separate stage1_batter_camera_power run; old contact curriculum status is incompatible.
# One episode = one plate appearance (strikeout, walk or ball in play).
# Decisions: stance once per pitch, then every fixed step (0.02 s) while the pitch is in flight until the swing.
# Values are a first-experiment starting point.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 2.0e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  batter_lesson:
    curriculum:
      - name: CenterTiming
        value: 0
        completion_criteria:
          measure: reward
          behavior: BaseballBatter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.2
          require_reset: false
      - name: SolidContact
        value: 1
        completion_criteria:
          measure: reward
          behavior: BaseballBatter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
          require_reset: false
      - name: LimitedLocationAndPose
        value: 2
        completion_criteria:
          measure: reward
          behavior: BaseballBatter
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
          require_reset: false
      - name: FullBatting
        value: 3
