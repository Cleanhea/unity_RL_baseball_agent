# Stage 3 with ML-Agents self-play for the batter-pitcher duel only.
# Scene: Assets/BaseballSimulation/Scenes/Training/Stage3_FullTeam.unity
# Batter and pitcher start from the stage2_batter_pitcher_selfplay checkpoints and take turns learning (the
# other plays a frozen past snapshot). Runners (team 0) and fielders (team 1) have no self_play block: they are
# MA-POCA groups that keep learning every step. ML-Agents switches the learning team whenever any self-play
# trainer reaches its own team_change, and keeps one ELO per team, so putting self_play on two behaviors per
# team would make the turns irregular (see docs/training-curriculum.md).
# self_play and max_steps values are the stage 2 self-play values (converted with ~23 batter decisions per pitch).
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/stage2_batter_pitcher_selfplay/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 2.0e-4
      beta: 2.0e-2  # raised from 5e-3: batter collapsed to taking (swing rate ~7%)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 20000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 50000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
  BaseballPitcher:
    trainer_type: ppo
    init_path: Training/results/stage2_batter_pitcher_selfplay/BaseballPitcher/checkpoint.pt
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 2.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 260000
    time_horizon: 8
    summary_freq: 2000
    self_play:
      save_steps: 2200
      team_change: 8700
      swap_steps: 2200
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
  BaseballRunner:
    trainer_type: poca
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
  BaseballFielder:
    trainer_type: baseball_fielder_poca  # registered direction-preserving POCA extension
    hyperparameters:
      # Collect fewer live-ball decisions before the first update; contact can be rare early on.
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3  # 1e-3 collapsed fielder entropy (2.0 -> 0.19) into a near-still policy (2026-10-02)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # keep equal to PlayOutcomeRewards.DefenseShapingGamma (fielder shaping reward)
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 64
    summary_freq: 2000
