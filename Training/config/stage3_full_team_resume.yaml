# Resume an existing stage3_full_team run. No init_path: --resume must load this run's own checkpoints.
# Do not use --force. See Training/README.md.
# Stage 3: offense (batter + runners, team 0) and defense (pitcher + 9 fielders, team 1) trained at the same time.
# Scene: Assets/BaseballSimulation/Scenes/Training/Stage3_FullTeam.unity
# All four behaviors resume their own stage 3 checkpoints.
# The 9 fielders (BaseballFielder) and 4 runners (BaseballRunner: batter-runner + runners starting on 1B/2B/3B)
# are each a SimpleMultiAgentGroup with a team reward, so they use MA-POCA.
# Batter/pitcher episode = one plate appearance. Fielder/runner group episode = one ball in play.
# Fielders and runners decide every 5 fixed steps (0.1 s) while the batted ball is live.
# 30% of new plate appearances start with random runners/outs (randomSituationProbability).
# Values are a first-experiment starting point.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 2.0e-4
      beta: 2.0e-2  # raised from 5e-3: batter collapsed to taking (swing rate ~7%)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 20000
  BaseballPitcher:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 2.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 400000
    time_horizon: 8
    summary_freq: 2000
  BaseballRunner:
    trainer_type: poca
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
  BaseballFielder:
    trainer_type: baseball_fielder_poca  # registered direction-preserving POCA extension
    hyperparameters:
      # Collect fewer live-ball decisions before the first update; contact can be rare early on.
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3  # 1e-3 collapsed fielder entropy (2.0 -> 0.19) into a near-still policy (2026-10-02)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # keep equal to PlayOutcomeRewards.DefenseShapingGamma (fielder shaping reward)
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 20000000
    time_horizon: 64
    summary_freq: 2000
