# Simplified defense (2026-10-07): C/1B/2B/3B fixed; CF only moves. Continuous 2 + discrete [3] (1B/2B/3B), no hold/home/relay.
# Camera batter contract (2026-10-07): 256x256 grayscale x3; incompatible with ray checkpoints.
# Stage 3 restart for the center fielder only (2026-10-07).
# Batter/pitcher/runners continue from the new camera + CF run; the center fielder starts fresh.
# Requires completed compatible stage-3 checkpoints. Do not load old five-action fielder checkpoints.
# init_path only loads weights; step counters start from 0 under the new run id.
# Everything else matches stage3_full_team.yaml.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/stage3_full_team_camera_cf/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 2.0e-4
      beta: 2.0e-2  # raised from 5e-3: batter collapsed to taking (swing rate ~7%)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 20000
  BaseballPitcher:
    trainer_type: ppo
    init_path: Training/results/stage3_full_team_camera_cf/BaseballPitcher/checkpoint.pt
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 2.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 400000
    time_horizon: 8
    summary_freq: 2000
  BaseballRunner:
    trainer_type: poca
    init_path: Training/results/stage3_full_team_camera_cf/BaseballRunner/checkpoint.pt
    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
  BaseballFielder:
    trainer_type: baseball_fielder_poca  # registered direction-preserving POCA extension
    hyperparameters:
      # Collect fewer live-ball decisions before the first update; contact can be rare early on.
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3  # 1e-3 collapsed fielder entropy (2.0 -> 0.19) into a near-still policy (2026-10-02)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99  # keep equal to PlayOutcomeRewards.DefenseShapingGamma (fielder shaping reward)
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 64
    summary_freq: 2000
