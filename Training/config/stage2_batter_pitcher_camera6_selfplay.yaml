# Camera6: six grayscale frames, 100-Hz batter decisions; two sides take turns learning.
# Batter decision-based schedules are doubled to preserve approximate pitches per phase.
# Pitcher schedules stay unchanged (one decision per pitch).
# Quality-gated entry point: Training/prepare_batter.py --prepared-stage2.
behaviors:
  BaseballBatter:
    trainer_type: ppo
    init_path: Training/results/stage1_batter_camera6_prepare/BaseballBatter/checkpoint.pt
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.9746794345
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9949874371
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 400000
    max_steps: 12000000
    time_horizon: 128
    summary_freq: 40000
    self_play:
      save_steps: 100000
      team_change: 400000
      swap_steps: 100000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
  BaseballPitcher:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 20000
    max_steps: 260000
    time_horizon: 8
    summary_freq: 2000
    self_play:
      save_steps: 2200
      team_change: 8700
      swap_steps: 2200
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  batter_prepared: 1.0
